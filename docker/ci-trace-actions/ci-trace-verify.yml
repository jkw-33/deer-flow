name: CI Trace verification
on:
  workflow_dispatch:
    inputs:
      repository:
        required: true
        type: string
      sha:
        required: true
        type: string
      path:
        required: true
        type: string
      mode:
        required: true
        type: string
      expected:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: docker pull node:22-bookworm-slim
      - run: python ci_actions_worker.py
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          SOURCE_SHA: ${{ inputs.sha }}
          SOURCE_PATH: ${{ inputs.path }}
          CHECK_MODE: ${{ inputs.mode }}
          EXPECTED: ${{ inputs.expected }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
