name: CI Trace verification fixture
on: [push]
permissions:
  contents: read
jobs:
  crlf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash ./scripts/check.sh
  independent:
    runs-on: ubuntu-latest
    steps:
      - name: Check independent Node assertion
        run: node -e "require('node:assert/strict').equal(Number('42'), 42)"
